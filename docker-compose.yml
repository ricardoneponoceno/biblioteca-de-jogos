x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:14
    container_name: gamelib-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_DATABASE:-gamelib_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gamelib-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: gamelib-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - gamelib-network
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 160M

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: gamelib-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gamelib-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M

  # Novo serviço para a API HLTB
  api-hltb:
    build:
      context: ./api-hltb
      dockerfile: Dockerfile
    container_name: gamelib-api-hltb
    restart: unless-stopped
    env_file:
      - ./api-hltb/.env # CORS_ORIGIN — sem isso, cai no default do api.py (CORS desativado)
    ports:
      - "127.0.0.1:3002:8000" # Mapeia a porta 3002 do seu PC para a 8000 do contentor
    networks:
      - gamelib-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  # Novo serviço para a API RAWG
  api-rawg:
    build:
      context: ./api-rawg
      dockerfile: Dockerfile
    container_name: gamelib-api-rawg
    restart: unless-stopped
    env_file:
      - ./api-rawg/.env # Carrega a chave de API e o CORS_ORIGIN do ficheiro .env
    ports:
      - "127.0.0.1:3003:8000" # Mapeia a porta 3003 do seu PC para a 8000 do contentor
    networks:
      - gamelib-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  townsquare:
    build:
      context: ./TownSquare
      dockerfile: Dockerfile
    container_name: gamelib-townsquare
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=http://localhost:8081,http://192.168.18.183:8081
      - AUTO_REGISTER=true
    ports:
      - "127.0.0.1:3004:8787"
    networks:
      - gamelib-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8787"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  gamelib-network:
    driver: bridge

# Dado do Postgres em volume nomeado (gerenciado pelo Docker), não bind mount
# no repo — evita o diretório postgres-data/ com permissão 700 travando o
# build (o Postgres força 700 no data dir e o build não consegue lê-lo no
# contexto). Em dev, o banco é recriável com `npm run migrate` + `npm run seed`.
volumes:
  pgdata:
